                          'detected_at': timestamp,
                          'approval_requested_at': timestamp,
                          'approved_by': None,
                          'approved_at': None
                      }
                  )
                  logger.info(f"Tracked service '{service_name}' for approval")
                  return True
              except Exception as e:
                  logger.error(f"Failed to track service for approval: {str(e)}")
                  return False


