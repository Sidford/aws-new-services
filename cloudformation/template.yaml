AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AWS Service Monitor — automatically detects new AWS services, compares them
  against a DynamoDB registry, updates an SCP deny-list in your AWS Organization,
  and sends email notifications. Runs daily via EventBridge.

# ==============================================================================
# Metadata — groups parameters in the CloudFormation console
# ==============================================================================
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Notifications"
        Parameters:
          - EmailRecipients
          - SenderEmail
          - ApprovalRecipients
      - Label:
          default: "SCP Management"
        Parameters:
          - ManageScpPolicy
          - ScpName
          - ScpSid
          - RequireScpApproval
          - OrganizationId
      - Label:
          default: "Service Approval Workflow"
        Parameters:
          - EnableServiceApprovalWorkflow
          - ApprovedServices
      - Label:
          default: "Scheduling & Monitoring"
        Parameters:
          - ScheduleExpression
          - EnableCloudWatchDashboard
    ParameterLabels:
      EmailRecipients:
        default: "Email Recipients (JSON array)"
      SenderEmail:
        default: "Sender Email Address"

# ==============================================================================
# Parameters
# ==============================================================================
Parameters:

  # ---------- Notifications -------------------------------------------------
  EmailRecipients:
    Type: String
    Description: >
      JSON array of email addresses to receive notifications.
      Example: ["ops@example.com","security@example.com"]
    AllowedPattern: '^\[".+"\]$'
    ConstraintDescription: >
      Must be a valid JSON array of quoted email strings,
      e.g. ["ops@example.com"] or ["a@b.com","c@d.com"]

  SenderEmail:
    Type: String
    Description: >
      Email address used to send notifications. Must be verified in SES
      in the deployment region before the Lambda can send mail.

  ApprovalRecipients:
    Type: String
    Default: "[]"
    Description: >
      JSON array of email addresses for approval requests. Defaults to
      EmailRecipients when set to [].
      Example: ["approver@example.com"]

  # ---------- SCP management ------------------------------------------------
  ManageScpPolicy:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Enable automatic SCP policy management. Set to "false" for
      notifications-only mode (detects services and sends emails but does
      NOT modify SCP policies).

  ScpName:
    Type: String
    Default: "blacklist"
    Description: Name of the existing Service Control Policy to manage.

  ScpSid:
    Type: String
    Default: "BlockNewServices"
    Description: >
      Statement ID (Sid) in the SCP to update with new services. Only the
      statement with this Sid is touched, allowing multiple statements in
      the same policy.

  RequireScpApproval:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      When "true" the Lambda sends a notification but does NOT apply SCP
      changes until manually approved (dry-run / approval-gate mode).

  OrganizationId:
    Type: String
    Default: ""
    Description: >
      AWS Organizations ID (e.g. o-xxxxxxxxxxxx) to scope the SCP IAM
      permission to least-privilege. Leave empty to allow any org policy ARN.

  # ---------- Service approval workflow -------------------------------------
  EnableServiceApprovalWorkflow:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Enable manual approval workflow for services moving from the deny-list
      to the approved list.

  ApprovedServices:
    Type: String
    Default: "[]"
    Description: >
      JSON array of services approved for use — excluded from the SCP
      deny-list. Example: ["ec2","s3","lambda"]

  # ---------- Scheduling & monitoring ---------------------------------------
  ScheduleExpression:
    Type: String
    Default: "cron(0 8 * * ? *)"
    Description: >
      EventBridge schedule expression controlling when the Lambda runs.
      Default is daily at 08:00 UTC.

  EnableCloudWatchDashboard:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Create a CloudWatch dashboard for at-a-glance monitoring.

# ==============================================================================
# Conditions
# ==============================================================================
Conditions:
  ManageScp:        !Equals [!Ref ManageScpPolicy, "true"]
  EnableDashboard:  !Equals [!Ref EnableCloudWatchDashboard, "true"]
  OrgIdProvided:    !Not [!Equals [!Ref OrganizationId, ""]]
  HasApprovalRecipients: !Not [!Equals [!Ref ApprovalRecipients, "[]"]]

# ==============================================================================
# Resources
# ==============================================================================
Resources:

  # ============================================================================
  # Permission boundary — created first so the role can reference it
  # ============================================================================
  LambdaPermissionBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: aws-service-monitor-lambda-boundary
      Description: Limits the Lambda execution role to only the services it needs
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDynamoDBOperations
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchWriteItem
            Resource: "*"
          - Sid: AllowS3Operations
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:PutObjectVersionTagging
              - s3:ListBucket
            Resource: "*"
          - Sid: AllowOrganizationsOperations
            Effect: Allow
            Action:
              - organizations:ListPolicies
              - organizations:DescribePolicy
              - organizations:UpdatePolicy
            Resource: "*"
          - Sid: AllowSESOperations
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: "*"
          - Sid: AllowCloudWatchAndLogging
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: "*"
          - Sid: AllowKMSOperations
            Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"
          - Sid: AllowSNSOperations
            Effect: Allow
            Action:
              - sns:Publish
            Resource: "*"
          - Sid: DenyDangerousActions
            Effect: Deny
            Action:
              - "iam:*"
              - sts:AssumeRole
              - ec2:TerminateInstances
              - rds:DeleteDBInstance
              - rds:DeleteDBCluster
              - s3:DeleteBucket
              - organizations:DetachPolicy
              - organizations:DeletePolicy
            Resource: "*"

  # ============================================================================
  # Lambda execution role
  # ============================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aws-service-monitor-lambda-role
      PermissionsBoundary: !Ref LambdaPermissionBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: AWS-Service-Monitor
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================================
  # KMS customer-managed key for DynamoDB at-rest encryption
  # LambdaExecutionRole must exist first (referenced in key policy)
  # ============================================================================
  DynamoDBKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for aws-service-monitor DynamoDB tables
      EnableKeyRotation: true
      PendingWindowInDays: 14
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowLambdaEncryptDecrypt
            Effect: Allow
            Principal:
              AWS: !GetAtt LambdaExecutionRole.Arn
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: "*"
      Tags:
        - Key: Project
          Value: AWS-Service-Monitor
        - Key: ManagedBy
          Value: CloudFormation

  DynamoDBKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/aws-service-monitor-dynamodb
      TargetKeyId: !Ref DynamoDBKMSKey

  # ============================================================================
  # DynamoDB tables
  # ============================================================================
  ServiceRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aws-service-monitor-registry
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: service_name
          AttributeType: S
      KeySchema:
        - AttributeName: service_name
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DynamoDBKMSKey
      Tags:
        - Key: Project
          Value: AWS-Service-Monitor
        - Key: ManagedBy
          Value: CloudFormation

  ApprovedServicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aws-service-monitor-approved-services
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: service_name
          AttributeType: S
        - AttributeName: approval_status
          AttributeType: S
      KeySchema:
        - AttributeName: service_name
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: approval-status-index
          KeySchema:
            - AttributeName: approval_status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DynamoDBKMSKey
      Tags:
        - Key: Project
          Value: AWS-Service-Monitor
        - Key: ManagedBy
          Value: CloudFormation

  PendingRegionalServicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aws-service-monitor-pending-regional
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: service_name
          AttributeType: S
        - AttributeName: detected_at
          AttributeType: S
        - AttributeName: region_name
          AttributeType: S
        - AttributeName: available_in_region
          AttributeType: N
      KeySchema:
        - AttributeName: service_name
          KeyType: HASH
        - AttributeName: detected_at
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: region-name-index
          KeySchema:
            - AttributeName: region_name
              KeyType: HASH
            - AttributeName: available_in_region
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DynamoDBKMSKey
      Tags:
        - Key: Project
          Value: AWS-Service-Monitor
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================================
  # S3 bucket for immutable baseline snapshots (T004 mitigation)
  # Object Lock + GOVERNANCE retention prevents tampering
  # ============================================================================
  BaselineSnapshotsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "service-monitor-baseline-${AWS::AccountId}-${AWS::Region}"
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 90
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldSnapshots
            Status: Enabled
            ExpirationInDays: 365
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - Key: Project
          Value: AWS-Service-Monitor
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================================
  # SNS topic for operational alerts
  # ============================================================================
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: aws-service-monitor-alerts
      Tags:
        - Key: Project
          Value: AWS-Service-Monitor
        - Key: ManagedBy
          Value: CloudFormation

  # ---- Custom resource: create email subscriptions from a JSON list --------
  # CloudFormation cannot iterate over a list to create N subscriptions,
  # so a helper Lambda parses the comma-delimited / JSON list and calls
  # sns:Subscribe for each address.

  SubscriptionsHelperRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aws-service-monitor-cfn-subscriptions-helper
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sns-subscribe-and-log
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:ListSubscriptionsByTopic
                Resource: !Ref AlertsTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"

  SubscriptionsHelperFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aws-service-monitor-cfn-subscriptions-helper
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt SubscriptionsHelperRole.Arn
      Timeout: 60
      Description: >
        CloudFormation custom resource — creates/removes SNS email subscriptions
        from a JSON list. Cleaned up automatically when the stack is deleted.
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request

          SNS = boto3.client('sns')


          def send(event, context, status, data=None, reason=''):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason or f'See CloudWatch logs for {context.log_stream_name}',
                  'PhysicalResourceId': event.get('PhysicalResourceId', 'SNSSubscriptions'),
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {},
              }).encode()
              req = urllib.request.Request(
                  event['ResponseURL'],
                  data=body,
                  headers={'Content-Type': ''},
                  method='PUT',
              )
              urllib.request.urlopen(req)


          def parse_emails(raw):
              """Accept a JSON array string or a bare comma-separated string."""
              raw = (raw or '').strip()
              if not raw or raw == '[]':
                  return []
              try:
                  parsed = json.loads(raw)
                  if isinstance(parsed, list):
                      return [e.strip() for e in parsed if isinstance(e, str) and e.strip()]
              except (json.JSONDecodeError, ValueError):
                  pass
              return [e.strip() for e in raw.split(',') if e.strip()]


          def handler(event, context):
              try:
                  topic_arn = event['ResourceProperties']['TopicArn']
                  emails = parse_emails(event['ResourceProperties'].get('EmailRecipients', '[]'))

                  if event['RequestType'] in ('Create', 'Update'):
                      if event['RequestType'] == 'Update':
                          old_emails = set(parse_emails(
                              event.get('OldResourceProperties', {}).get('EmailRecipients', '[]')
                          ))
                          new_emails = set(emails)
                          to_remove = old_emails - new_emails
                          if to_remove:
                              paginator = SNS.get_paginator('list_subscriptions_by_topic')
                              for page in paginator.paginate(TopicArn=topic_arn):
                                  for sub in page['Subscriptions']:
                                      if (sub['Protocol'] == 'email'
                                              and sub['Endpoint'] in to_remove
                                              and sub['SubscriptionArn'] != 'PendingConfirmation'):
                                          SNS.unsubscribe(SubscriptionArn=sub['SubscriptionArn'])

                      for email in emails:
                          SNS.subscribe(TopicArn=topic_arn, Protocol='email', Endpoint=email)

                  elif event['RequestType'] == 'Delete':
                      # Best-effort: remove confirmed subscriptions so the topic
                      # can be cleanly deleted with the stack.
                      try:
                          paginator = SNS.get_paginator('list_subscriptions_by_topic')
                          for page in paginator.paginate(TopicArn=topic_arn):
                              for sub in page['Subscriptions']:
                                  if (sub['Protocol'] == 'email'
                                          and sub['SubscriptionArn'] != 'PendingConfirmation'):
                                      SNS.unsubscribe(SubscriptionArn=sub['SubscriptionArn'])
                      except Exception:
                          pass  # Don't block stack deletion

                  send(event, context, 'SUCCESS')
              except Exception as exc:
                  send(event, context, 'FAILED', reason=str(exc))

  AlertsTopicSubscriptions:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: AlertsTopic
    Properties:
      ServiceToken: !GetAtt SubscriptionsHelperFunction.Arn
      TopicArn: !Ref AlertsTopic
      EmailRecipients: !Ref EmailRecipients

  # ============================================================================
  # CloudWatch log group (pre-created to avoid circular dependency and to
  # set the retention policy before the function writes its first log)
  # ============================================================================
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/aws-service-monitor
      RetentionInDays: 90

  # ============================================================================
  # IAM policies — attached as separate resources to mirror the modular
  # Terraform structure and keep each policy individually inspectable
  # ============================================================================

  # DynamoDB access
  LambdaDynamoDBPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: lambda-dynamodb-policy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchWriteItem
            Resource: !GetAtt ServiceRegistryTable.Arn
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
            Resource:
              - !GetAtt ApprovedServicesTable.Arn
              - !Sub "${ApprovedServicesTable.Arn}/index/approval-status-index"
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !GetAtt PendingRegionalServicesTable.Arn
              - !Sub "${PendingRegionalServicesTable.Arn}/index/region-name-index"

  # S3 baseline snapshots
  LambdaS3Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: lambda-s3-baseline-policy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:PutObjectVersionTagging
            Resource: !Sub "${BaselineSnapshotsBucket.Arn}/*"
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !GetAtt BaselineSnapshotsBucket.Arn

  # SES email sending
  LambdaSESPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: lambda-ses-policy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: "*"

  # CloudWatch custom metrics
  LambdaCloudWatchPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: lambda-cloudwatch-metrics-policy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: "*"

  # SNS alert publishing
  LambdaSNSPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: lambda-sns-policy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref AlertsTopic

  # CloudWatch Logs
  LambdaLogsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: lambda-logs-policy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "${LambdaLogGroup.Arn}:*"

  # KMS decrypt for DynamoDB CMK
  LambdaKMSPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: lambda-kms-dynamodb-policy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: !GetAtt DynamoDBKMSKey.Arn

  # Organizations / SCP — only when manage_scp_policy = true
  LambdaSCPPolicy:
    Type: AWS::IAM::Policy
    Condition: ManageScp
    Properties:
      PolicyName: lambda-scp-policy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - organizations:ListPolicies
            Resource: "*"
            Condition:
              StringEquals:
                "organizations:PolicyType": SERVICE_CONTROL_POLICY
          - Effect: Allow
            Action:
              - organizations:DescribePolicy
              - organizations:UpdatePolicy
            # Scope to the specific org when OrganizationId is provided;
            # otherwise allow any policy ARN in the account (still scoped by type condition).
            Resource: !If
              - OrgIdProvided
              - !Sub "arn:aws:organizations::${AWS::AccountId}:policy/${OrganizationId}/service_control_policy/p-*"
              - !Sub "arn:aws:organizations::${AWS::AccountId}:policy/o-*/service_control_policy/p-*"
            Condition:
              StringEquals:
                "organizations:PolicyType": SERVICE_CONTROL_POLICY

  # ============================================================================
  # Lambda function
  # ============================================================================
  ServiceMonitorFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaDynamoDBPolicy
      - LambdaS3Policy
      - LambdaSESPolicy
      - LambdaCloudWatchPolicy
      - LambdaSNSPolicy
      - LambdaLogsPolicy
      - LambdaKMSPolicy
      - LambdaLogGroup
    Properties:
      FunctionName: aws-service-monitor
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import os
          import html
          import ssl
          import urllib.request
          import urllib.error
          import boto3
          import logging
          import re
          import copy
          import hashlib
          import time
          from datetime import datetime
          from typing import List, Dict, Set, Tuple
          from botocore.config import Config

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          dynamodb = boto3.resource('dynamodb')
          organizations = boto3.client('organizations')
          ses = boto3.client('ses')
          s3 = boto3.client('s3')
          cloudwatch = boto3.client('cloudwatch')
          sns = boto3.client('sns')

          DYNAMODB_TABLE = os.environ['DYNAMODB_TABLE']
          APPROVED_SERVICES_TABLE = os.environ.get('APPROVED_SERVICES_TABLE', '')
          PENDING_REGIONAL_SERVICES_TABLE = os.environ.get('PENDING_REGIONAL_SERVICES_TABLE', '')
          SCP_NAME = os.environ['SCP_NAME']
          EMAIL_RECIPIENTS = json.loads(os.environ['EMAIL_RECIPIENTS'])
          SENDER_EMAIL = os.environ['SENDER_EMAIL']
          REQUIRE_APPROVAL = os.environ.get('REQUIRE_APPROVAL', 'true').lower() == 'true'
          MANAGE_SCP_POLICY = os.environ.get('MANAGE_SCP_POLICY', 'true').lower() == 'true'
          BASELINE_SNAPSHOT_BUCKET = os.environ.get('BASELINE_SNAPSHOT_BUCKET', '')
          ALERT_TOPIC_ARN = os.environ.get('ALERT_TOPIC_ARN', '')
          ENABLE_SERVICE_APPROVAL_WORKFLOW = os.environ.get('ENABLE_SERVICE_APPROVAL_WORKFLOW', 'true').lower() == 'true'
          APPROVED_SERVICES_LIST = json.loads(os.environ.get('APPROVED_SERVICES_LIST', '[]'))
          APPROVAL_RECIPIENTS = json.loads(os.environ.get('APPROVAL_RECIPIENTS', '[]'))
          ENABLE_REGIONAL_MONITORING = os.environ.get('ENABLE_REGIONAL_MONITORING', 'true').lower() == 'true'
          MONITORED_REGION = os.environ.get('MONITORED_REGION', 'eu-west-2')

          SERVICE_REFERENCE_URL = "https://servicereference.us-east-1.amazonaws.com/"
          SERVICE_NAME_PATTERN = re.compile(r'^[a-z0-9\-]+$')
          MAX_SERVICE_NAME_LENGTH = 30
          BASELINE_MARKER = "__baseline_initialized__"


          def fetch_aws_services() -> Set[str]:
              """Fetch AWS services with HTTPS certificate validation."""
              try:
                  # ssl.create_default_context() validates certificates by default —
                  # same security guarantee as requests' verify=True.
                  ctx = ssl.create_default_context()
                  req = urllib.request.Request(SERVICE_REFERENCE_URL)
                  with urllib.request.urlopen(req, timeout=30, context=ctx) as response:
                      if response.status != 200:
                          logger.error(f"Unexpected HTTP status {response.status} from service reference")
                          return set()
                      data = json.loads(response.read().decode('utf-8'))

                  services = set()
                  if isinstance(data, list):
                      services = {item['service'] for item in data if isinstance(item, dict) and 'service' in item}
                  elif isinstance(data, dict):
                      if 'services' in data:
                          services = set(data['services'].keys())
                      else:
                          services = set(data.keys())

                  logger.info(f"Fetched {len(services)} services from AWS reference")
                  return services

              except ssl.SSLError as e:
                  logger.error(f"SSL certificate validation failed: {str(e)}")
                  return set()
              except urllib.error.URLError as e:
                  if isinstance(e.reason, ssl.SSLError):
                      logger.error(f"SSL certificate validation failed: {str(e.reason)}")
                  else:
                      logger.error(f"Failed to fetch AWS services: {str(e)}")
                  return set()
              except (json.JSONDecodeError, KeyError, TypeError) as e:
                  logger.error(f"Failed to parse service reference response: {str(e)}")
                  return set()


          def calculate_baseline_checksum(services: Set[str]) -> str:
              """Calculate SHA256 checksum of baseline services for integrity verification."""
              service_string = json.dumps(sorted(list(services)), separators=(',', ':'))
              checksum = hashlib.sha256(service_string.encode()).hexdigest()
              logger.debug(f"Calculated baseline checksum: {checksum}")
              return checksum


          def check_regional_availability(services: List[str], region: str = 'eu-west-2', timeout_per_service: int = 2) -> Dict:
              """
              Check if services are available in a specific region with timeout guards.
              Returns dict: {
                  'service_name': {
                      'available_in_region': bool,
                      'checked_at': timestamp
                  }
              }
              """
              timestamp = datetime.utcnow().isoformat()
              result = {}
              start_time = time.time()
              max_check_duration = 240

              try:
                  if len(services) > 150:
                      logger.warning(f"High number of services ({len(services)}) for regional check; may timeout")

                  for service in services:
                      elapsed = time.time() - start_time
                      if elapsed > max_check_duration:
                          logger.warning(f"Regional check timeout guard triggered after {service} ({elapsed:.1f}s elapsed); skipping remaining {len(services) - len(result)} services")
                          for remaining_service in services:
                              if remaining_service not in result:
                                  result[remaining_service] = {
                                      'available_in_region': False,
                                      'checked_at': timestamp,
                                      'timeout': True
                                  }
                          break

                      try:
                          config = Config(
                              connect_timeout=timeout_per_service,
                              read_timeout=timeout_per_service,
                              retries={'max_attempts': 0}
                          )
                          client = boto3.client(service, region_name=region, config=config)
                          available = True
                          logger.debug(f"Service {service} available in {region}")
                      except Exception as e:
                          available = False
                          logger.debug(f"Service {service} not available in {region}: {str(e)}")

                      result[service] = {
                          'available_in_region': available,
                          'checked_at': timestamp
                      }

                  elapsed = time.time() - start_time
                  logger.info(f"Regional availability check completed in {elapsed:.1f}s for {len(result)} services")
                  return result

              except Exception as e:
                  logger.error(f"Error checking regional availability: {str(e)}")
                  return {
                      service: {'available_in_region': False, 'checked_at': timestamp}
                      for service in services
                  }


          def track_service_for_regional_monitoring(
              service_name: str,
              region: str,
              detected_at: str
          ) -> bool:
              """Add service to pending_regional_services table for monitoring."""
              if not PENDING_REGIONAL_SERVICES_TABLE:
                  logger.debug("PENDING_REGIONAL_SERVICES_TABLE not configured, skipping tracking")
                  return True

              try:
                  table = dynamodb.Table(PENDING_REGIONAL_SERVICES_TABLE)
                  timestamp = datetime.utcnow().isoformat()

                  table.put_item(
                      Item={
                          'service_name': service_name,
                          'detected_at': detected_at,
                          'first_detected_at': detected_at,
                          'region_name': region,
                          'available_in_region': 0,
                          'last_checked_at': timestamp,
                          'notification_sent': False
                      },
                      ConditionExpression='attribute_not_exists(service_name)'
                  )

                  logger.info(f"Tracking {service_name} for regional availability in {region}")
                  return True

              except Exception as e:
                  if 'ConditionalCheckFailedException' in str(type(e).__name__):
                      logger.debug(f"Service {service_name} already tracked for regional monitoring")
                      return True
                  logger.error(f"Error tracking service for regional monitoring: {str(e)}")
                  return False


          def check_pending_regional_services(timestamp: str) -> Dict:
              """Daily monitoring: Check if pending services have become available."""
              if not PENDING_REGIONAL_SERVICES_TABLE or not ENABLE_REGIONAL_MONITORING:
                  return {'available': [], 'still_pending': [], 'errors': []}

              try:
                  table = dynamodb.Table(PENDING_REGIONAL_SERVICES_TABLE)
                  region = MONITORED_REGION

                  response = table.query(
                      IndexName='region-name-index',
                      KeyConditionExpression='region_name = :region AND available_in_region = :available',
                      ExpressionAttributeValues={
                          ':region': region,
                          ':available': 0
                      }
                  )

                  pending_services = response.get('Items', [])

                  if not pending_services:
                      logger.info("No pending regional services to check")
                      return {'available': [], 'still_pending': [], 'errors': []}

                  logger.info(f"Checking {len(pending_services)} pending services for regional availability")

                  pending_names = [item['service_name'] for item in pending_services]
                  regional_status = check_regional_availability(pending_names, region=region)
                  summary = {'available': [], 'still_pending': [], 'errors': []}

                  for service_item in pending_services:
                      service_name = service_item['service_name']
                      detected_at = service_item['detected_at']

                      if regional_status[service_name]['available_in_region']:
                          try:
                              check_time = datetime.utcnow().isoformat()

                              table.update_item(
                                  Key={
                                      'service_name': service_name,
                                      'detected_at': detected_at
                                  },
                                  UpdateExpression='SET available_in_region = :avail, available_at = :ts, last_checked_at = :checked',
                                  ExpressionAttributeValues={
                                      ':avail': 1,
                                      ':ts': check_time,
                                      ':checked': check_time
                                  }
                              )

                              if service_item.get('notification_sent') is not True:
                                  send_regional_availability_notification(service_name, check_time)
                                  table.update_item(
                                      Key={
                                          'service_name': service_name,
                                          'detected_at': detected_at
                                      },
                                      UpdateExpression='SET notification_sent = :sent',
                                      ExpressionAttributeValues={':sent': True}
                                  )

                              logger.info(f"Service {service_name} is now available in {region}")
                              summary['available'].append(service_name)

                          except Exception as e:
                              logger.error(f"Error updating service {service_name}: {str(e)}")
                              summary['errors'].append({'service': service_name, 'error': str(e)})
                      else:
                          try:
                              table.update_item(
                                  Key={
                                      'service_name': service_name,
                                      'detected_at': detected_at
                                  },
                                  UpdateExpression='SET last_checked_at = :ts',
                                  ExpressionAttributeValues={':ts': datetime.utcnow().isoformat()}
                              )
                              summary['still_pending'].append(service_name)
                          except Exception as e:
                              logger.error(f"Error updating last_checked_at for {service_name}: {str(e)}")
                              summary['errors'].append({'service': service_name, 'error': str(e)})

                  return summary

              except Exception as e:
                  logger.error(f"Error checking pending regional services: {str(e)}")
                  return {'available': [], 'still_pending': [], 'errors': [str(e)]}


