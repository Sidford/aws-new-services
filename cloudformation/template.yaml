                          <p>The AWS Service Monitor has detected a potential tampering attempt.</p>
                          <div class="details">
                              <strong>Integrity Check Failed:</strong><br/>
                              {integrity_msg}
                          </div>
                          <div class="action">
                              <strong>IMMEDIATE ACTION REQUIRED:</strong>
                              <ul>
                                  <li>Review CloudTrail logs for recent DynamoDB modifications</li>
                                  <li>Verify baseline data integrity in AWS console</li>
                                  <li>Check S3 immutable backup: baseline-snapshots/</li>
                                  <li>Initiate incident response procedure</li>
                              </ul>
                          </div>
                          <div>
                              <p><strong>Alert Time:</strong> {timestamp}</p>
                              <p><strong>Severity:</strong> CRITICAL</p>
                          </div>
                      </div>
                  </body>
                  </html>
                  """

                  text_body = f"""
          SECURITY ALERT: Baseline Integrity Violation
          {'='*60}

          BASELINE TAMPERING DETECTED

          INTEGRITY CHECK FAILED:
          {integrity_msg}

          IMMEDIATE ACTION REQUIRED:
            1. Review CloudTrail logs for recent DynamoDB modifications
            2. Verify baseline data integrity in AWS console
            3. Check S3 immutable backup: baseline-snapshots/
            4. Initiate incident response procedure

          Alert Time: {timestamp}
          Severity: CRITICAL
          """

                  for recipient in EMAIL_RECIPIENTS:
                      ses.send_email(
                          Source=SENDER_EMAIL,
                          Destination={'ToAddresses': [recipient]},
                          Message={
                              'Subject': {
                                  'Data': 'SECURITY ALERT: Baseline Integrity Violation Detected',
                                  'Charset': 'UTF-8'
                              },
                              'Body': {
                                  'Text': {'Data': text_body, 'Charset': 'UTF-8'},
                                  'Html': {'Data': html_body, 'Charset': 'UTF-8'}
                              }
                          }
                      )

                  logger.info(f"Security alert email sent to {len(EMAIL_RECIPIENTS)} recipient(s)")
                  return True

              except Exception as e:
                  logger.error(f"Error sending tamper alert email: {str(e)}")
                  return False


          def publish_metrics(new_services_count: int, total_services: int, integrity_ok: bool) -> None:
              """Publish custom metrics to CloudWatch for dashboard and alarms."""
              try:
                  cloudwatch.put_metric_data(
                      Namespace='AWS/ServiceMonitor',
                      MetricData=[
                          {
                              'MetricName': 'NewServicesDetected',
                              'Value': new_services_count,
                              'Unit': 'Count',
                              'Timestamp': datetime.utcnow()
                          },
                          {
                              'MetricName': 'TotalTrackedServices',
                              'Value': total_services,
                              'Unit': 'Count',
                              'Timestamp': datetime.utcnow()
                          },
                          {
                              'MetricName': 'BaselineIntegrityStatus',
                              'Value': 1 if integrity_ok else 0,
                              'Unit': 'None',
                              'Timestamp': datetime.utcnow()
                          }
                      ]
                  )
                  logger.info("Published metrics to CloudWatch")
              except Exception as e:
                  logger.error(f"Error publishing metrics to CloudWatch: {str(e)}")


          def send_integrity_alert_sns(integrity_msg: str) -> bool:
              """Send baseline integrity violation alert via SNS."""
              if not ALERT_TOPIC_ARN:
                  logger.warning("ALERT_TOPIC_ARN not configured, skipping SNS alert")
                  return False

              try:
                  sns.publish(
                      TopicArn=ALERT_TOPIC_ARN,
                      Subject='CRITICAL: AWS Service Monitor - Baseline Integrity Violation',
                      Message=f"""
          SECURITY ALERT: Baseline Integrity Violation Detected

          {integrity_msg}

          Timestamp: {datetime.utcnow().isoformat()}

          Actions:
          1. Check CloudWatch Logs: /aws/lambda/aws-service-monitor
          2. Review CloudTrail logs for unauthorized DynamoDB modifications
          3. Verify baseline data in DynamoDB table: {DYNAMODB_TABLE}
          4. Check S3 immutable backup: s3://{BASELINE_SNAPSHOT_BUCKET}/baseline-snapshots/
          5. Consider restoring from PITR if tampering confirmed
          """
                  )
                  logger.info("Sent baseline integrity violation alert via SNS")
                  return True
              except Exception as e:
                  logger.error(f"Error sending SNS integrity alert: {str(e)}")
                  return False


          def send_notification_email(new_services: List[str], scp_status: str = 'unknown', regional_status: Dict = None) -> bool:
              """Send formatted email notification about new services."""
              try:
                  timestamp = datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')
                  html_body = generate_html_email(new_services, timestamp, scp_status, regional_status)
                  text_body = generate_text_email(new_services, timestamp, scp_status, regional_status)
                  subject = f'AWS Service Monitor: {len(new_services)} New Service(s) Detected'

                  for recipient in EMAIL_RECIPIENTS:
                      ses.send_email(
                          Source=SENDER_EMAIL,
                          Destination={'ToAddresses': [recipient]},
                          Message={
                              'Subject': {'Data': subject, 'Charset': 'UTF-8'},
                              'Body': {
                                  'Text': {'Data': text_body, 'Charset': 'UTF-8'},
                                  'Html': {'Data': html_body, 'Charset': 'UTF-8'}
                              }
                          }
                      )

                  logger.info(f"Sent email notification to {len(EMAIL_RECIPIENTS)} recipient(s)")
                  return True

              except Exception as e:
                  logger.error(f"Error sending email: {str(e)}")
                  return False


          def get_scp_status_message(status: str) -> Tuple[str, str]:
              """Get status message and color for email."""
              status_messages = {
                  'success': ('SCP Updated', 'Services have been added to the SCP policy'),
                  'pending_approval': ('Pending Approval', 'Changes are pending manual approval'),
                  'failed': ('SCP Update Failed', 'SCP update encountered an error'),
                  'not_found': ('SCP Not Found', 'Service Control Policy not found'),
                  'not_attempted': ('Not Attempted', 'SCP update was not attempted'),
                  'unknown': ('Unknown', 'SCP status unknown')
              }
              return status_messages.get(status, status_messages['unknown'])


          def generate_html_email(services: List[str], timestamp: str, scp_status: str = 'unknown', regional_status: Dict = None) -> str:
              """Generate formatted HTML email."""
              from html import escape
              services_html = '\n'.join([f'                <li>{escape(service)}</li>' for service in sorted(services)])
              status_title, status_message = get_scp_status_message(scp_status)

              regional_html = ""
              if regional_status and ENABLE_REGIONAL_MONITORING:
                  available_count = sum(1 for s in regional_status.values() if s['available_in_region'])
                  pending_count = len(regional_status) - available_count

                  if pending_count > 0:
                      regional_html = f"""
                          <div class="status-box" style="border-left-color: #17a2b8;">
                              <div class="status-title">Regional Status ({MONITORED_REGION})</div>
                              <p><strong>Available in {MONITORED_REGION}:</strong> {available_count}/{len(regional_status)}</p>
                              <p><strong>Pending {MONITORED_REGION} deployment:</strong> {pending_count}/{len(regional_status)}</p>
                          </div>
                          """

              html_content = f"""
              <html>
              <head>
                  <style>
                      body {{ font-family: Arial, sans-serif; color: #333; }}
                      .container {{ max-width: 600px; margin: 0 auto; padding: 20px; }}
                      .header {{ background-color: #FF9900; color: white; padding: 20px; border-radius: 5px; margin-bottom: 20px; }}
                      .content {{ background-color: #f5f5f5; padding: 20px; border-radius: 5px; }}
                      .service-list {{ background-color: white; padding: 15px; border-left: 4px solid #FF9900; margin: 15px 0; }}
                      .status-box {{ background-color: white; padding: 15px; border-left: 4px solid #007bff; margin: 15px 0; }}
                      .status-title {{ font-weight: bold; font-size: 16px; }}
                      .footer {{ color: #666; font-size: 12px; margin-top: 20px; }}
                      h2 {{ color: #FF9900; margin-top: 0; }}
                      ul {{ list-style-type: none; padding-left: 0; }}
                      li {{ padding: 8px 0; border-bottom: 1px solid #eee; }}
                  </style>
              </head>
              <body>
                  <div class="container">
                      <div class="header"><h1>AWS Service Monitor Alert</h1></div>
                      <div class="content">
                          <h2>New AWS Services Detected</h2>
                          <p>Identified <strong>{len(services)} new service(s)</strong> as of {timestamp}.</p>
                          <div class="status-box">
                              <div class="status-title">{status_title}</div>
                              <p>{status_message}</p>
                          </div>
                          {regional_html}
                          <div class="service-list">
                              <h3>New Services:</h3>
                              <ul>
          {services_html}
                              </ul>
                          </div>
                      </div>
                      <div class="footer">
                          <p>Automated notification from AWS Service Monitor.</p>
                          <p>Scan Time: {timestamp}</p>
                      </div>
                  </div>
              </body>
              </html>
              """
              return html_content


          def generate_text_email(services: List[str], timestamp: str, scp_status: str = 'unknown', regional_status: Dict = None) -> str:
              """Generate plain text email."""
              services_text = '\n'.join([f'  - {service}' for service in sorted(services)])
              status_title, status_message = get_scp_status_message(scp_status)

              regional_text = ""
              if regional_status and ENABLE_REGIONAL_MONITORING:
                  available_count = sum(1 for s in regional_status.values() if s['available_in_region'])
                  pending_count = len(regional_status) - available_count
                  if pending_count > 0:
                      regional_text = f"\nREGIONAL STATUS ({MONITORED_REGION}):\n  Available: {available_count}/{len(regional_status)}\n  Pending: {pending_count}/{len(regional_status)}\n"

              return f"""AWS SERVICE MONITOR ALERT
          {'='*50}

          New AWS Services Detected: {len(services)} as of {timestamp}

          STATUS: {status_title}
          {status_message}

          NEW SERVICES:
          {services_text}
          {regional_text}
          {'='*50}
          Scan Time: {timestamp}
          """


          def get_approved_services() -> Set[str]:
              """Get list of approved services from configuration and DynamoDB."""
              approved = set(APPROVED_SERVICES_LIST)

              if not APPROVED_SERVICES_TABLE:
                  logger.info(f"Loaded {len(approved)} pre-configured approved services")
                  return approved

              try:
                  table = dynamodb.Table(APPROVED_SERVICES_TABLE)
                  response = table.query(
                      IndexName='approval-status-index',
                      KeyConditionExpression='approval_status = :status',
                      ExpressionAttributeValues={':status': 'approved'}
                  )

                  for item in response.get('Items', []):
                      approved.add(item['service_name'])

                  logger.info(f"Loaded {len(approved)} approved services (config + DynamoDB)")
                  return approved
              except Exception as e:
                  logger.warning(f"Failed to load approved services from DynamoDB: {str(e)}")
                  return approved


          def track_service_for_approval(service_name: str, timestamp: str) -> bool:
              """Track a new service as pending approval in DynamoDB."""
              if not APPROVED_SERVICES_TABLE or not ENABLE_SERVICE_APPROVAL_WORKFLOW:
                  return True

              try:
                  table = dynamodb.Table(APPROVED_SERVICES_TABLE)
                  table.put_item(
                      Item={
                          'service_name': service_name,
                          'approval_status': 'pending',
                          'detected_at': timestamp,
                          'approval_requested_at': timestamp,
                          'approved_by': None,
                          'approved_at': None
                      }
                  )
                  logger.info(f"Tracked service '{service_name}' for approval")
                  return True
              except Exception as e:
                  logger.error(f"Failed to track service for approval: {str(e)}")
                  return False


          def send_approval_request_email(service_name: str, timestamp: str) -> bool:
              """Send approval request email for a new blacklisted service."""
              if not ENABLE_SERVICE_APPROVAL_WORKFLOW:
                  return True

              approval_recipients = APPROVAL_RECIPIENTS if APPROVAL_RECIPIENTS else EMAIL_RECIPIENTS
              if not approval_recipients:
                  logger.warning("No approval recipients configured, skipping approval email")
                  return True

              try:
                  subject = f"AWS Service Monitor: Approval Request for '{service_name}'"

                  html_body = f"""
          <html><body style="font-family: Arial, sans-serif; color: #333;">
              <h2>Service Approval Request</h2>
              <p>A new AWS service has been detected and added to the blacklist SCP.</p>
              <div style="background-color: #f5f5f5; padding: 15px; border-radius: 5px;">
                  <h3>Service Details</h3>
                  <p><strong>Service Name:</strong> {html.escape(service_name)}</p>
                  <p><strong>Detected At:</strong> {timestamp}</p>
                  <p><strong>Status:</strong> Pending Approval</p>
              </div>
              <h3>Next Steps</h3>
              <ol>
                  <li>Review the service: <strong>{html.escape(service_name)}</strong></li>
                  <li>Determine if this service should be approved for your organization</li>
                  <li>Add to the <code>ApprovedServices</code> parameter and update the stack</li>
              </ol>
              <p style="color: #999; font-size: 12px;">Automated notification from AWS Service Monitor. Sent: {timestamp}</p>
          </body></html>
          """

                  text_body = f"""Service Approval Request

          Service Name: {service_name}
          Detected At: {timestamp}
          Status: Pending Approval

          Add '{service_name}' to the ApprovedServices stack parameter to remove it from the deny-list.

          ---
          Automated notification from AWS Service Monitor. Sent: {timestamp}
          """

                  ses.send_email(
                      Source=SENDER_EMAIL,
                      Destination={'ToAddresses': approval_recipients},
                      Message={
                          'Subject': {'Data': subject},
                          'Body': {
                              'Html': {'Data': html_body},
                              'Text': {'Data': text_body}
                          }
                      }
                  )
                  logger.info(f"Sent approval request email for '{service_name}' to {len(approval_recipients)} recipients")
                  return True
              except Exception as e:
                  logger.error(f"Failed to send approval request email: {str(e)}")
                  return False


          def store_pending_scp_update(preview: Dict) -> None:
              """Store pending SCP update for approval workflow."""
              try:
                  table = dynamodb.Table(DYNAMODB_TABLE)
                  timestamp = datetime.utcnow().isoformat()

                  table.put_item(Item={
                      'service_name': f"__pending_scp_update__{timestamp}",
                      'first_seen': timestamp,
                      'last_updated': timestamp,
                      'preview': preview,
                      'status': 'pending_approval'
                  })

                  logger.info(f"Stored pending SCP update for approval")

              except Exception as e:
                  logger.error(f"Error storing pending SCP update: {str(e)}")


          def lambda_handler(event, context):
              """Main Lambda handler with security validation and approval workflows."""
              start_time = datetime.utcnow().isoformat()
              logger.info(f"Starting AWS service monitor at {start_time}")

              try:
                  current_services = fetch_aws_services()
                  if not current_services:
                      logger.error("No services fetched from AWS reference")
                      return {
                          'statusCode': 500,
                          'body': json.dumps({'error': 'Failed to fetch AWS services'})
                      }

                  logger.info(f"Total services: {len(current_services)}")

                  if not is_baseline_initialized():
                      logger.info("=== BASELINE INITIALIZATION ===")
                      success = initialize_baseline(current_services)

                      if success:
                          logger.info(f"Baseline initialized with {len(current_services)} services")
                          publish_metrics(0, len(current_services), True)
                          return {
                              'statusCode': 200,
                              'body': json.dumps({
                                  'message': 'Baseline established',
                                  'baseline_services': len(current_services),
                                  'status': 'baseline_initialized',
                                  'note': 'No actions taken on first run. Monitoring will begin on next execution.',
                                  'scan_time': start_time
                              })
                          }
                      else:
                          logger.error("Failed to initialize baseline")
                          return {
                              'statusCode': 500,
                              'body': json.dumps({'error': 'Failed to initialize baseline', 'scan_time': start_time})
                          }

                  is_valid, integrity_msg = verify_baseline_integrity()

                  if not is_valid:
                      logger.critical(f"SECURITY ALERT: {integrity_msg}")
                      send_tamper_alert_email(integrity_msg)
                      send_integrity_alert_sns(integrity_msg)
                      publish_metrics(0, 0, False)
                      return {
                          'statusCode': 500,
                          'body': json.dumps({
                              'error': 'Baseline integrity check failed',
                              'details': integrity_msg,
                              'action': 'Security alert sent'
                          })
                      }

                  if ENABLE_REGIONAL_MONITORING:
                      logger.info("=== CHECKING PENDING REGIONAL SERVICES ===")
                      pending_summary = check_pending_regional_services(start_time)
                      if pending_summary['available']:
                          logger.info(f"Services now available in {MONITORED_REGION}: {pending_summary['available']}")
                      if pending_summary['errors']:
                          logger.warning(f"Errors checking pending services: {pending_summary['errors']}")

                  tracked_services = get_tracked_services()
                  new_services = current_services - tracked_services

                  logger.info(f"Tracked services: {len(tracked_services)}")
                  logger.info(f"New services: {len(new_services)}")

                  if new_services:
                      known_services = get_known_aws_services()
                      valid_services, invalid_services = validate_service_names(new_services, known_services)

                      if not valid_services:
                          logger.error(f"All services failed validation: {invalid_services}")
                          return {
                              'statusCode': 400,
                              'body': json.dumps({'error': 'All services failed validation', 'invalid_services': invalid_services})
                          }

                      new_services_list = sorted(list(valid_services))

                      store_new_services(new_services_list)
                      update_baseline_checksum(tracked_services | set(new_services_list))

                      regional_status = {}
                      if ENABLE_REGIONAL_MONITORING:
                          logger.info(f"Checking regional availability for {len(new_services_list)} new services in {MONITORED_REGION}")
                          regional_status = check_regional_availability(new_services_list, region=MONITORED_REGION)

                          for service in new_services_list:
                              if not regional_status[service]['available_in_region']:
                                  track_service_for_regional_monitoring(service, MONITORED_REGION, start_time)
                                  logger.info(f"Service '{service}' NOT available in {MONITORED_REGION} - tracking for future availability")

                      approved_services = get_approved_services()
                      if approved_services:
                          logger.info(f"Approved services: {len(approved_services)}")
                      approved_from_new = [s for s in new_services_list if s in approved_services]
                      services_for_scp = [s for s in new_services_list if s not in approved_services]

                      if approved_from_new:
                          logger.warning(f"T015: approved services excluded from SCP deny list: {approved_from_new}")

                      if services_for_scp and ENABLE_SERVICE_APPROVAL_WORKFLOW:
                          for service in services_for_scp:
                              track_service_for_approval(service, start_time)
                              send_approval_request_email(service, start_time)

                      scp_update_status = 'not_attempted'
                      scp_error = None

                      if MANAGE_SCP_POLICY:
                          scp_policy = get_scp_policy()

                          if services_for_scp and scp_policy:
                              preview = generate_scp_preview(scp_policy, services_for_scp)

                              if REQUIRE_APPROVAL:
                                  logger.info("Approval required - storing preview for manual review")
                                  scp_update_status = 'pending_approval'
                                  store_pending_scp_update(preview)
                              else:
                                  success, message = update_scp_with_services(scp_policy, services_for_scp)
                                  scp_update_status = 'success' if success else 'failed'
                                  scp_error = message if not success else None
                                  logger.info(f"SCP update result: {message}")
                          elif not services_for_scp and new_services_list:
                              logger.info("All new services are approved - no SCP update needed")
                              scp_update_status = 'no_unapproved_services'
                          elif scp_policy is None:
                              logger.warning(f"SCP '{SCP_NAME}' not found")
                              scp_update_status = 'not_found'
                      else:
                          logger.info("SCP management disabled - skipping policy updates")
                          scp_update_status = 'disabled'

                      send_notification_email(new_services_list, scp_update_status, regional_status)
                      publish_metrics(len(new_services_list), len(tracked_services) + len(new_services_list), True)

                      response = {
                          'statusCode': 200,
                          'body': {
                              'message': f'Processed {len(new_services_list)} new services',
                              'new_services': new_services_list,
                              'scp_status': scp_update_status,
                              'invalid_services': invalid_services if invalid_services else None,
                              'scan_time': start_time
                          }
                      }

                      if scp_error:
                          response['body']['scp_error'] = scp_error

                      return {
                          'statusCode': response['statusCode'],
                          'body': json.dumps(response['body'])
                      }
                  else:
                      logger.info("No new services detected")
                      publish_metrics(0, len(tracked_services), True)
                      return {
                          'statusCode': 200,
                          'body': json.dumps({'message': 'No new services detected', 'scan_time': start_time})
                      }

              except Exception as e:
                  logger.exception(f"Unexpected error in lambda_handler: {str(e)}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': 'Internal server error', 'details': str(e)})
                  }
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref ServiceRegistryTable
          APPROVED_SERVICES_TABLE: !Ref ApprovedServicesTable
          PENDING_REGIONAL_SERVICES_TABLE: !Ref PendingRegionalServicesTable
          SCP_NAME: !Ref ScpName
          SCP_SID: !Ref ScpSid
          # Lambda code calls json.loads() on these env vars, so they must
          # be valid JSON array strings (deploy.sh / parameters.example.json
          # show the expected format).
          EMAIL_RECIPIENTS: !Ref EmailRecipients
          SENDER_EMAIL: !Ref SenderEmail
          REQUIRE_APPROVAL: !Ref RequireScpApproval
          MANAGE_SCP_POLICY: !Ref ManageScpPolicy
          BASELINE_SNAPSHOT_BUCKET: !Ref BaselineSnapshotsBucket
          ALERT_TOPIC_ARN: !Ref AlertsTopic
          ENABLE_SERVICE_APPROVAL_WORKFLOW: !Ref EnableServiceApprovalWorkflow
          APPROVED_SERVICES_LIST: !Ref ApprovedServices
          APPROVAL_RECIPIENTS: !If
            - HasApprovalRecipients
            - !Ref ApprovalRecipients
            - !Ref EmailRecipients
          ENABLE_REGIONAL_MONITORING: "true"
          MONITORED_REGION: !Ref AWS::Region
      Tags:
        - Key: Project
          Value: AWS-Service-Monitor
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================================
  # EventBridge daily schedule
  # ============================================================================
  DailyScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: aws-service-monitor-daily
      Description: Trigger AWS service monitor daily
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: AWSServiceMonitorLambda
          Arn: !GetAtt ServiceMonitorFunction.Arn

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ServiceMonitorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyScheduleRule.Arn

  # ============================================================================
  # CloudWatch log metric filter — tracks permission-boundary deny events
  # ============================================================================
  PermissionBoundaryDenyMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: LambdaLogGroup
    Properties:
      LogGroupName: /aws/lambda/aws-service-monitor
      FilterPattern: '"Baseline update failed"'
      MetricTransformations:
        - MetricName: PermissionBoundaryDenyHits
          MetricNamespace: ServiceMonitor
          DefaultValue: 0
          MetricValue: "1"

  # ============================================================================
  # CloudWatch alarms
  # ============================================================================

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: service-monitor-lambda-errors
      AlarmDescription: Alert when Lambda function encounters errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: aws-service-monitor
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  LambdaDurationHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: service-monitor-lambda-duration-high
      AlarmDescription: >
        Alert when Lambda duration approaches the 300 s timeout (90 % threshold)
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: aws-service-monitor
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 270000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  LambdaTimeoutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: service-monitor-lambda-timeout
      AlarmDescription: Alert when Lambda execution reaches the maximum timeout
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: aws-service-monitor
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  DynamoDBReadThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: service-monitor-dynamodb-read-throttles
      AlarmDescription: Alert when DynamoDB read operations are throttled
      Namespace: AWS/DynamoDB
      MetricName: UserErrors
      Dimensions:
        - Name: TableName
          Value: !Ref ServiceRegistryTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  DynamoDBWriteThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: service-monitor-dynamodb-write-throttles
      AlarmDescription: Alert when DynamoDB write operations are throttled
      Namespace: AWS/DynamoDB
      MetricName: UserErrors
      Dimensions:
        - Name: TableName
          Value: !Ref ServiceRegistryTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  BaselineIntegrityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: service-monitor-baseline-integrity-violation
      AlarmDescription: >
        CRITICAL: Baseline integrity verification failed — possible tampering detected
      Namespace: ServiceMonitor
      MetricName: BaselineIntegrityStatus
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  MissedExecutionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: service-monitor-missed-execution
      AlarmDescription: Alert if the scheduled Lambda invocation was missed (no invocation in 24 h)
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: aws-service-monitor
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: breaching

  DynamoDBUnusualWritesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: service-monitor-dynamodb-unusual-writes
      AlarmDescription: >
        Unusually high DynamoDB write volume — possible unauthorized direct
        table access (T003)
      Namespace: AWS/DynamoDB
      MetricName: ConsumedWriteCapacityUnits
      Dimensions:
        - Name: TableName
          Value: !Ref ServiceRegistryTable
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 500
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  ApprovedServicesUnusualWritesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: service-monitor-approved-services-unusual-writes
      AlarmDescription: >
        Unexpected writes to approved-services table — possible approval
        workflow bypass attempt (T015)
      Namespace: AWS/DynamoDB
      MetricName: ConsumedWriteCapacityUnits
      Dimensions:
        - Name: TableName
          Value: !Ref ApprovedServicesTable
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  EventBridgeRuleDisabledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: service-monitor-eventbridge-rule-disabled
      AlarmDescription: >
        Alert if EventBridge rule is disabled or not triggering
        (no rules triggered in 24 h)
      Namespace: AWS/Events
      MetricName: TriggeredRules
      Dimensions:
        - Name: Rule
          Value: aws-service-monitor-daily
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: breaching

  PermissionBoundaryDenyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: service-monitor-permission-boundary-deny
      AlarmDescription: >
        Alert on permission-boundary Deny hits — high-fidelity compromise
        signal (T011/T015)
      Namespace: ServiceMonitor
      MetricName: PermissionBoundaryDenyHits
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertsTopic

  # ============================================================================
  # CloudWatch dashboard (optional)
  # ============================================================================
  ServiceMonitorDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: EnableDashboard
    Properties:
      DashboardName: aws-service-monitor
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "aws-service-monitor",
                   {"stat": "Sum", "label": "Invocations"}]
                ],
                "period": 3600,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Lambda Invocations (Daily)",
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "aws-service-monitor",
                   {"stat": "Sum", "label": "Errors"}]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Lambda Errors (5-minute)",
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "aws-service-monitor",
                   {"stat": "Average", "label": "Avg Duration (ms)"}],
                  ["...", {"stat": "Maximum", "label": "Max Duration (ms)"}]
                ],
                "period": 3600,
                "region": "${AWS::Region}",
                "title": "Lambda Duration",
                "yAxis": {"left": {"min": 0, "max": 300000}}
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["ServiceMonitor", "BaselineIntegrityStatus",
                   {"stat": "Minimum", "label": "Integrity Status (1=OK)"}]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "title": "Baseline Integrity",
                "yAxis": {"left": {"min": 0, "max": 1}}
              }
            }
          ]
        }

# ==============================================================================
# Outputs
# ==============================================================================
Outputs:

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref ServiceMonitorFunction
    Export:
      Name: !Sub "${AWS::StackName}-LambdaFunctionName"

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ServiceMonitorFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LambdaFunctionArn"

  LambdaRoleArn:
    Description: Lambda execution role ARN
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LambdaRoleArn"

  AlertsTopicArn:
    Description: SNS topic ARN for operational alerts
    Value: !Ref AlertsTopic
    Export:
      Name: !Sub "${AWS::StackName}-AlertsTopicArn"

  ServiceRegistryTableName:
    Description: DynamoDB service registry table name
    Value: !Ref ServiceRegistryTable
    Export:
      Name: !Sub "${AWS::StackName}-ServiceRegistryTableName"

  ApprovedServicesTableName:
    Description: DynamoDB approved-services table name
    Value: !Ref ApprovedServicesTable
    Export:
      Name: !Sub "${AWS::StackName}-ApprovedServicesTableName"

  PendingRegionalServicesTableName:
    Description: DynamoDB pending-regional-services table name
    Value: !Ref PendingRegionalServicesTable
    Export:
      Name: !Sub "${AWS::StackName}-PendingRegionalServicesTableName"

  BaselineSnapshotsBucketName:
    Description: S3 baseline snapshots bucket name
    Value: !Ref BaselineSnapshotsBucket
    Export:
      Name: !Sub "${AWS::StackName}-BaselineSnapshotsBucketName"

  EventBridgeRuleName:
    Description: EventBridge daily schedule rule name
    Value: !Ref DailyScheduleRule
    Export:
      Name: !Sub "${AWS::StackName}-EventBridgeRuleName"

  DashboardUrl:
    Condition: EnableDashboard
    Description: CloudWatch dashboard URL
    Value: !Sub "https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=aws-service-monitor"

  ManualInvokeCommand:
    Description: AWS CLI command to invoke the Lambda manually for testing
    Value: !Sub >
      aws lambda invoke --function-name ${ServiceMonitorFunction}
      --region ${AWS::Region} response.json && cat response.json

  LogTailCommand:
    Description: AWS CLI command to tail Lambda logs
    Value: !Sub >
      aws logs tail /aws/lambda/aws-service-monitor
      --region ${AWS::Region} --follow
